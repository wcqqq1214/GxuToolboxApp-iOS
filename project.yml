name: GxuToolApp
options:
  bundleIdPrefix: com.gxutool
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    GXU_BUNDLE_ID: com.gxutool.ios
    GXU_APP_GROUP: group.$(GXU_BUNDLE_ID)
    GXU_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(GXU_BUNDLE_ID)
    GXU_CAMPUS_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(GXU_BUNDLE_ID).campus-network
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "20200"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  GxuCore: {path: Packages/GxuCore}
  GxuDesign: {path: Packages/GxuDesign}
  FeatureAccount: {path: Packages/FeatureAccount}
  FeatureSchedule: {path: Packages/FeatureSchedule}
  FeatureCampus: {path: Packages/FeatureCampus}
  FeatureExam: {path: Packages/FeatureExam}
  FeatureCourse: {path: Packages/FeatureCourse}
  FeatureMisc: {path: Packages/FeatureMisc}
targets:
  GxuToolApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/Info.plist", "Resources/GxuToolApp.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GXU_BUNDLE_ID)
        PRODUCT_NAME: GxuToolApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 西大工具箱
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        GxuKeychainAccessGroup: "$(GXU_KEYCHAIN_GROUP)"
        GxuCampusKeychainAccessGroup: "$(GXU_CAMPUS_KEYCHAIN_GROUP)"
        GxuAppGroupID: "$(GXU_APP_GROUP)"
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        LSApplicationQueriesSchemes: [iosamap, baidumap]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSExceptionDomains:
            ca.gxu.edu.cn: {NSExceptionAllowsInsecureHTTPLoads: true}
            pec.gxu.edu.cn: {NSExceptionAllowsInsecureHTTPLoads: true}
            xlzxms.gxu.edu.cn: {NSExceptionAllowsInsecureHTTPLoads: true}
            self.gxu.edu.cn: {NSExceptionAllowsInsecureHTTPLoads: true}
    entitlements:
      path: App/Resources/GxuToolApp.entitlements
      properties:
        com.apple.security.application-groups: ["$(GXU_APP_GROUP)"]
        keychain-access-groups: ["$(GXU_KEYCHAIN_GROUP)", "$(GXU_CAMPUS_KEYCHAIN_GROUP)"]
    dependencies:
      - target: GxuWidget
      - {package: GxuCore, product: GxuFoundation}
      - {package: GxuCore, product: GxuNetworking}
      - {package: GxuCore, product: GxuAuth}
      - {package: GxuCore, product: GxuStorage}
      - {package: GxuDesign, product: GxuDesign}
      - {package: FeatureAccount, product: FeatureAccount}
      - {package: FeatureSchedule, product: ScheduleKit}
      - {package: FeatureSchedule, product: ScheduleUI}
      - {package: FeatureCampus, product: FeatureCampus}
      - {package: FeatureCampus, product: CampusKit}
      - {package: FeatureExam, product: ExamKit}
      - {package: FeatureExam, product: ExamUI}
      - {package: FeatureCourse, product: FeatureCourse}
      - {package: FeatureCourse, product: ClassWidgetKit}
      - {package: FeatureCourse, product: ToolboxIntents}
      - {package: FeatureMisc, product: FeatureMisc}
  GxuToolAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: GxuToolApp
      - {package: GxuCore, product: GxuTestSupport}
      - {package: GRDB, product: GRDB}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GXU_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  GxuToolAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GxuToolApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GXU_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
  GxuWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GXU_BUNDLE_ID).widget
        PRODUCT_NAME: GxuWidget
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 西大工具箱小组件
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GxuKeychainAccessGroup: "$(GXU_KEYCHAIN_GROUP)"
        GxuAppGroupID: "$(GXU_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GxuWidget.entitlements
      properties:
        com.apple.security.application-groups: ["$(GXU_APP_GROUP)"]
        keychain-access-groups: ["$(GXU_KEYCHAIN_GROUP)"]
    dependencies:
      - {package: GxuCore, product: GxuFoundation}
      - {package: GxuCore, product: GxuStorage}
      - {package: GxuCore, product: GxuNetworking}
      - {package: GxuCore, product: GxuAuth}
      - {package: FeatureSchedule, product: ScheduleKit}
      - {package: FeatureExam, product: ExamKit}
      - {package: GxuDesign, product: GxuDesign}
      - {package: FeatureCourse, product: ClassWidgetKit}
schemes:
  GxuToolApp:
    build:
      targets:
        GxuToolApp: all
    test:
      targets: [GxuToolAppTests, GxuToolAppUITests]
