name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  no-comments:
    name: No code comments
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/lint-requirements.txt
      - run: python scripts/lint-no-comments.py
      - run: python scripts/tests/test_lint_no_comments.py
